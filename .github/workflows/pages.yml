name: Deploy docs site to GitHub Pages

# Builds the /site app and publishes it to GitHub Pages. The site bundles the
# library straight from ../src (see site/vite.config.ts), so the docs always
# match the code on main — no npm publish race.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source -> "GitHub Actions". After that this workflow deploys on every push to
# main that touches site/, and can be run manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'design-tokens/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Smoke test every route and example
        run: npm run smoke

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
