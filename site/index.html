<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cast UI</title>
    <meta
      name="description"
      content="Cast UI — a cross-platform React Native design system. Component documentation and showcase."
    />

    <!--
      Cast UI ships no fonts. The host page must load two:
        • Inter                     — all text
        • Material Symbols Outlined — the <Icon> component
      Without the symbols font, icons render as their literal name (e.g. the
      word "stadia_controller") instead of the glyph.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: #f7f8fa;
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
