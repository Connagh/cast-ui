<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <title>Cast UI</title>
    <meta
      name="description"
      content="Cast UI is an open source design system for React Native. One set of components for iOS, Android and the web, themeable at runtime, designed in Figma and shipped as code."
    />

    <!--
      Cast UI ships no fonts. The host page must load:
        • Inter                     — all text
        • Material Symbols Outlined — the <Icon> component
        • JetBrains Mono            — CodeBlock and code samples
      Without the symbols font, icons render as their literal name.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme-gallery fonts (the /themes page). Each gallery theme pairs a display
      and a body face; loading them here lets the live preview reskin its type.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
      rel="stylesheet"
    />

    <script>
      // GitHub Pages single-page-app path restore. 404.html turned the real
      // path into a ?/ query; put it back before the app boots so the router
      // sees the URL the visitor asked for.
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>

    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      /* Light-mode default for the true page background (surface/base), so the
         overscroll area matches before React mounts. Shell keeps it in sync with
         the active colour mode after hydration. */
      html {
        background-color: #f9fafb;
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
